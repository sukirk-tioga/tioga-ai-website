name: Production health check

# Runs the full functional suite against the live site — this is what
# actually calls Claude through each demo endpoint, so it costs a small
# amount of real money per run. Scheduled daily rather than on every push.
# This is exactly the check that would have caught the 2026-07-27
# migration-assessment outage (Anthropic retired the model it called) —
# without it, the demo could silently sit broken indefinitely.

on:
  schedule:
    - cron: "0 13 * * *" # 6am PT / 1pm UTC, daily
  workflow_dispatch: {} # allow manual "run now" from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://tioga.ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run full suite against production (structural + functional)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-prod
          path: playwright-report/
          retention-days: 30
